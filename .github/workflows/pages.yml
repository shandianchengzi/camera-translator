name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify calculations
        run: node test.cjs
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/camera-qa" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/camera-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify interactions and saved settings
        run: PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/camera-qa/node_modules/playwright" node browser-test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html style.css calculator.js app.js scene.svg _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
