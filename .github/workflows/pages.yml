name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify calculations
        run: node test.cjs
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/camera-qa" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/camera-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify interactions and saved settings
        run: PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/camera-qa/node_modules/playwright" node browser-test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html style.css calculator.js app.js scene.svg _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text()
          for asset in ('style.css', 'calculator.js', 'app.js'):
              pattern = r'(src|href)="' + re.escape(asset) + r'(?:\?[^"]*)?"'
              html = re.sub(pattern, lambda m: m.group(1) + '="' + asset + '?v=' + os.environ['GITHUB_SHA'] + '"', html)
          page.write_text(html)
          PY
      - name: Mirror built Pages site to Cloudflare
        continue-on-error: true
        uses: shandianchengzi/skill/manage-github-pages/cloudflare-backup@4c1bf8604fc78dabb0babc83bfa0e2c1fa645327
        with:
          directory: _site
          project: sdz-camera-translator
          site-prefix: camera-translator
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
